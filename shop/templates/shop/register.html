{% extends 'shop/base.html' %}

{% block extra_css %}
<style>
    .auth-page {
        width: 90%;
        max-width: 600px;
        margin: 70px auto 100px;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-header p {
        font-size: 11px;
        letter-spacing: 2px;
        color: #777;
        margin-bottom: 12px;
    }

    .auth-header h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 42px;
        font-weight: 400;
    }

    .auth-form {
        border: 1px solid #ddd;
        padding: 35px;
    }

    .auth-form label {
        display: block;
        font-size: 10px;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
    }

    .auth-form input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border: 1px solid #ccc;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .auth-button {
        width: 100%;
        padding: 16px;
        border: none;
        background: #222;
        color: white;
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
    }

    .auth-button:hover {
        background: #444;
    }

    .auth-footer {
        text-align: center;
        margin-top: 25px;
        font-size: 13px;
        color: #666;
    }

    .auth-footer a {
        color: #222;
        font-weight: 600;
    }

    .message {
        margin-bottom: 20px;
        padding: 12px;
        background: #f5f5f5;
        font-size: 13px;
    }
</style>
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-header">

        <p>JOIN BHAVIKA</p>

        <h1>Create Account</h1>

    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form
        method="POST"
        class="auth-form"
    >

        {% csrf_token %}


        <label>FULL NAME</label>

        <input
            type="text"
            name="full_name"
            placeholder="Enter your full name"
            required
        >


        <label>EMAIL</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>PHONE NUMBER</label>

        <input
            type="text"
            name="phone"
            placeholder="10-digit mobile number"
            maxlength="10"
            required
        >


        <label>PASSWORD</label>

        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >


        <label>CONFIRM PASSWORD</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm your password"
            required
        >


        <label>ADDRESS</label>

        <input
            type="text"
            name="address_line1"
            placeholder="House number, street, area"
            required
        >


        <label>ADDRESS LINE 2</label>

        <input
            type="text"
            name="address_line2"
            placeholder="Apartment, landmark, etc."
        >


        <label>CITY</label>

        <input
            type="text"
            name="city"
            placeholder="Enter city"
            required
        >


        <label>STATE</label>

        <input
            type="text"
            name="state"
            placeholder="Enter state"
            required
        >


        <label>PINCODE</label>

        <input
            type="text"
            name="pincode"
            placeholder="6-digit pincode"
            maxlength="6"
            required
        >


        <button
            type="submit"
            class="auth-button"
        >
            CREATE ACCOUNT
        </button>

    </form>


    <div class="auth-footer">

        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>

    </div>

</section>

{% endblock %}
