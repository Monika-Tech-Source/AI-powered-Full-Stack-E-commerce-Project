{% extends 'shop/base.html' %}

{% block extra_css %}
<style>
    .auth-page {
        width: 90%;
        max-width: 500px;
        margin: 90px auto 120px;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-header p {
        font-size: 11px;
        letter-spacing: 2px;
        color: #777;
        margin-bottom: 12px;
    }

    .auth-header h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 42px;
        font-weight: 400;
    }

    .auth-form {
        border: 1px solid #ddd;
        padding: 35px;
    }

    .auth-form label {
        display: block;
        font-size: 10px;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
    }

    .auth-form input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border: 1px solid #ccc;
        margin-bottom: 22px;
        font-size: 14px;
    }

    .auth-button {
        width: 100%;
        padding: 16px;
        border: none;
        background: #222;
        color: white;
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
    }

    .auth-button:hover {
        background: #444;
    }

    .auth-footer {
        text-align: center;
        margin-top: 25px;
        font-size: 13px;
        color: #666;
    }

    .auth-footer a {
        color: #222;
        font-weight: 600;
    }

    .message {
        margin-bottom: 20px;
        padding: 12px;
        background: #f5f5f5;
        font-size: 13px;
    }
</style>
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-header">

        <p>WELCOME BACK</p>

        <h1>Login</h1>

    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form
        method="POST"
        class="auth-form"
    >

        {% csrf_token %}


        <label>EMAIL</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>PASSWORD</label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            class="auth-button"
        >
            LOGIN
        </button>

    </form>


    <div class="auth-footer">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </div>

</section>

{% endblock %}
