{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Edit Product
    </title>


    <style>

        body {

            margin: 0;

            padding: 40px;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }


        .container {

            max-width: 800px;

            margin: auto;

            background: white;

            padding: 30px;

            border: 1px solid #ddd;
        }


        h1 {

            margin-top: 0;
        }


        .field {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: bold;
        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 11px;

            box-sizing: border-box;

            border: 1px solid #ccc;
        }


        textarea {

            min-height: 100px;

            resize: vertical;
        }


        .image-preview {

            margin-top: 10px;
        }


        .image-preview img {

            width: 180px;

            height: 220px;

            object-fit: cover;

            border: 1px solid #ddd;
        }


        .help-text {

            margin-top: 7px;

            font-size: 12px;

            color: #666;

            line-height: 1.5;
        }


        .button {

            padding: 12px 20px;

            background: #111;

            color: white;

            border: none;

            cursor: pointer;
        }


        .back {

            margin-left: 10px;

            color: #111;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Edit Product
    </h1>


    <form method="POST">

        {% csrf_token %}


        <!-- CATEGORY -->

        <div class="field">

            <label>
                Category
            </label>

            <select
                name="category_id"
                required
            >

                {% for category in categories %}

                    <option
                        value="{{ category.category_id }}"

                        {% if category.category_id == product.category_id %}
                            selected
                        {% endif %}
                    >

                        {{ category.category_name }}

                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- PRODUCT NAME -->

        <div class="field">

            <label>
                Product Name
            </label>

            <input
                type="text"
                name="product_name"
                value="{{ product.product_name }}"
                required
            >

        </div>


        <!-- DESCRIPTION -->

        <div class="field">

            <label>
                Description
            </label>

            <textarea
                name="description"
                required
            >{{ product.description }}</textarea>

        </div>


        <!-- PRICE -->

        <div class="field">

            <label>
                Price
            </label>

            <input
                type="number"
                name="price"
                step="0.01"
                min="0"
                value="{{ product.price }}"
                required
            >

        </div>


        <!-- BRAND -->

        <div class="field">

            <label>
                Brand
            </label>

            <input
                type="text"
                name="brand"
                value="{{ product.brand|default:'' }}"
            >

        </div>


        <!-- IMAGE PATH -->

        <div class="field">

            <label>
                Image Path
            </label>

            <input
                type="text"
                name="image_url"
                value="{{ product.image_url }}"
                required
            >


            <div class="help-text">

                This must be the path of an existing image
                inside your static folder.

                <br><br>

                Example:

                <br>

                shop/images/products/men_products/men_shirts_Tshirts/men_casual_cotton_shirt.jpg

            </div>


            <!-- IMAGE PREVIEW -->

            <div class="image-preview">

                <p>
                    Current Image:
                </p>


                {% if product.image_url %}

                    <img
                        src="{% static product.image_url %}"
                        alt="{{ product.product_name }}"
                    >

                {% endif %}

            </div>

        </div>


        <!-- PRODUCT TYPE -->

        <div class="field">

            <label>
                Product Type
            </label>

            <input
                type="text"
                name="product_type"
                value="{{ product.product_type|default:'' }}"
                placeholder="mens_shirts / womens_tops / casual_sneakers"
            >

        </div>


        <!-- GENDER -->

        <div class="field">

            <label>
                Gender
            </label>

            <select
                name="gender"
            >

                <option
                    value=""

                    {% if not product.gender %}
                        selected
                    {% endif %}
                >
                    Select Gender
                </option>


                <option
                    value="Men"

                    {% if product.gender == "Men" %}
                        selected
                    {% endif %}
                >
                    Men
                </option>


                <option
                    value="Women"

                    {% if product.gender == "Women" %}
                        selected
                    {% endif %}
                >
                    Women
                </option>


                <option
                    value="Kids"

                    {% if product.gender == "Kids" %}
                        selected
                    {% endif %}
                >
                    Kids
                </option>

            </select>

        </div>


        <!-- UPDATE -->

        <button
            type="submit"
            class="button"
        >
            UPDATE PRODUCT
        </button>


        <a
            href="{% url 'admin_products' %}"
            class="back"
        >
            Cancel
        </a>


    </form>


</div>


</body>

</html>
